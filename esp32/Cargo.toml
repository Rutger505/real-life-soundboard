[package]
name = "soundboard-esp32"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "soundboard-esp32"
harness = false

[dependencies]
# 0.52 fixes the `c_char` vs `i8` mismatch on newer Xtensa rustc toolchains (#570)
esp-idf-svc = { version = "0.52", features = ["experimental"] }
esp-idf-hal = "0.46"
embedded-hal = "1"
enumset = "1"
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
