[package]
name = "soundboard-esp32"
version = "0.4.0"
edition = "2021"
resolver = "2"
rust-version = "1.85"

[[bin]]
name = "soundboard-esp32"
harness = false

[dependencies]
esp-idf-svc = { version = "0.53", features = ["experimental"] }
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

[profile.dev]
# Rust's debug build is far too slow and too big for the ESP32.
debug = true
opt-level = "z"
