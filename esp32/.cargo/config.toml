# Bare-metal Xtensa target. No ESP-IDF, no ldproxy: esp-hal ships the linker
# script (linkall.x) and we pull it in with a plain linker arg below.
[build]
target = "xtensa-esp32-none-elf"

[target.xtensa-esp32-none-elf]
rustflags = [
  # esp-hal's linker script; wires up the ROM layout, IRAM/DRAM sections, etc.
  "-C", "link-arg=-Tlinkall.x",
  # Needed for esp-backtrace to walk the stack on a panic.
  "-C", "force-frame-pointers",
]

# The Xtensa target has no prebuilt std/core, so build the sysroot crates we
# actually use (core + alloc for the BLE host's heap-backed collections).
[unstable]
build-std = ["core", "alloc"]

[env]
ESP_LOG = "info"
