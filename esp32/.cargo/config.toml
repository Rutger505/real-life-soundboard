[build]
target = "xtensa-esp32-espidf"

[unstable]
build-std = ["std", "panic_abort"]

[target.xtensa-esp32-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[env]
# esp-idf-svc 0.52 targets ESP-IDF 5.4/5.5 (needs newer BLE symbols like
# esp_ble_gattc_enh_open / esp_ble_conn_params_t that don't exist in 5.2)
ESP_IDF_VERSION = "v5.4.2"
MCU = "esp32"
