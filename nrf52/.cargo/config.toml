[target.thumbv7em-none-eabihf]
# Flashes through the SWD probe and streams the defmt log over RTT.
runner = "probe-rs run --chip nRF52840_xxAA"

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"
# bindgen for nrf-sdc/nrf-mpsl needs the ARM C headers (arm-none-eabi-newlib).
BINDGEN_EXTRA_CLANG_ARGS = "--sysroot=/usr/arm-none-eabi"
